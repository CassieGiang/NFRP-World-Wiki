<div><div class="mtitle">Welcome to NFRP World<small>Page 1 of 15</small></div>
<div class="msec" style="max-height:330px;overflow:auto"><p style="margin:0 0 8px">NFRP World adds techniques, clans, hidden villages, ranks, missions and rituals on top of World of Naruto.</p><p style="margin:0 0 8px">This short guide covers the basics: learning techniques, chakra, ranks and exams, training with a sensei, how enemies fight, and where the settings are.</p><p style="margin:0 0 8px">You can open it again any time from Options → Mod settings → NFRP World → Village life → Guide, or type "guide" in the settings search.</p></div>

<div><div class="mtitle">Learning techniques<small>Page 2 of 15</small></div>
<div class="msec" style="max-height:330px;overflow:auto"><p style="margin:0 0 8px">Every ninja follows a build. Select a colonist and press the Ninja build button: it decides which kinds of techniques they can learn (Ninjutsu, Genjutsu, Taijutsu, Medical) and how far.</p><p style="margin:0 0 8px">Ways to learn techniques:<br>• Technique scrolls from missions, merchants and villages teach one technique of their rank.<br>• A scribe desk copies a technique another ninja knows onto a scroll.<br>• Training buildings (training post, dummy, battle ring, chakra apparatus, star platform) slowly raise class levels, which unlock stronger techniques.</p><p style="margin:0 0 8px">Learned techniques appear as buttons when the ninja is selected.</p></div>
<div class="msec" style="border-left:3px solid var(--w-good)"><h4 class="mgood">Try it</h4><p style="margin:0">Select a ninja and press Ninja build: pick Specialist for the kind you want them to grow in.</p></div>
</div>

<div><div class="mtitle">Chakra<small>Page 3 of 15</small></div>
<div class="msec" style="max-height:330px;overflow:auto"><p style="margin:0 0 8px">Every technique costs chakra; the cost is shown on its button, and higher ranks cost more. Chakra comes back over time.</p><p style="margin:0 0 8px">A ninja who is nearly out of chakra looks pale and pants. Plan fights so your strongest techniques are used when they matter.</p><p style="margin:0 0 8px">If a cast is cut short before the technique fires (the caster is interrupted, the target dies or there is not enough chakra left), it fizzles: a grey puff and "Fizzled" appear over your ninja and the technique does not go off.</p></div>
</div>

<div><div class="mtitle">Ranks and exams<small>Page 4 of 15</small></div>
<div class="msec" style="max-height:330px;overflow:auto"><p style="margin:0 0 8px">Ninja rise through ranks by passing exams: genin, chūnin, jōnin and village leader. Their ninja level is the highest of their Ninjutsu, Taijutsu and Genjutsu class levels.</p><ul style="margin:0 0 8px;padding-left:18px"><li>Genin: ninja level 3.</li><li>Chūnin: a year as genin, ninja level 8, and Melee or Shooting 6.</li><li>Jōnin: two years as chūnin, ninja level 13, and two of Melee, Shooting, Intellectual, Medicine at 8.</li><li>Village leader: four years as jōnin, ninja level 16 and Social 8 (only one leader per village).</li></ul><p style="margin:0 0 8px">The rank exam arrives as an event. A friendly village also holds the chūnin exam: genin of ninja level 6 or more can enter, and those who win their final duel become chūnin on the spot.</p><p style="margin:0 0 8px">Hover over a ninja's rank status to see what the next exam asks for.</p></div>
<div class="msec" style="border-left:3px solid var(--w-good)"><h4 class="mgood">Try it</h4><p style="margin:0">Hover over a ninja's rank status to see what the next exam asks for.</p></div>

<div><div class="mtitle">Sensei training<small>Page 5 of 15</small></div>
<div class="msec" style="max-height:330px;overflow:auto"><p style="margin:0 0 8px">A jōnin or the village leader can teach younger ninja. Select the student and use the Sensei button to choose their teacher. While the sensei is close by during training or sparring, the student learns three times as fast in the sensei's best class.</p><p style="margin:0 0 8px">One-handed signs let a ninja make hand signs with one hand, so they can cast while holding a weapon. They are learned only through training: about 14 sessions alone, and every session with the sensei nearby counts three times.</p></div>

<div><div class="mtitle">How enemies fight<small>Page 6 of 15</small></div>
<div class="msec" style="max-height:330px;overflow:auto"><p style="margin:0 0 8px">Enemy ninja use their techniques with a tactics level you choose (currently Smart):</p><ul style="margin:0 0 8px;padding-left:18px"><li>Off: enemy ninjas fight the way the base game and the technique framework make them.</li><li>Basic: enemies pick the technique that does the most for its chakra, spare their own side with area techniques and escape when nearly beaten.</li><li>Smart: Basic plus keeping their distance with ranged techniques, focus fire, pincers from opposite sides, support and medics. Genin are sloppier than jonin; harder storytellers sharpen them.</li></ul><p style="margin:0 0 8px">Change it in the settings: Combat tab → Enemy AI.</p></div>

<div><div class="mtitle">Ninja research<small>Page 7 of 15</small></div>
<div class="msec" style="max-height:330px;overflow:auto"><p style="margin:0 0 8px">The stronger tools of NFRP World are researched on World of Naruto's ninja research tab (Research → the ninja tab), next to World of Naruto's own projects. The quickest way there is the Ninja research button at the top of the Ninja world panel: it opens the research screen on that tab, and the panel also shows how many projects are done and which ones are ready.</p><ul style="margin:0 0 8px;padding-left:18px"><li>Starter gear needs no research: headbands, basic clothing, packs and pouches, D-rank seals, the scribe desk and technique scrolls, the training dummy and field medicine.</li><li>Four tiers follow: scribe arts, alchemy, traps and weaponsmithing; then sealing, chakra studies, gadgets and metallurgy; then high sealing, chakra-forged gear, gems and bloodline science; and finally supreme sealing, legendary forging and relics.</li><li>The highest projects need a scroll library or a chakra study apparatus linked to the research bench; both also speed up research.</li></ul><p style="margin:0 0 8px">The cost can be changed, or all ninja research skipped, in the settings: Village life tab → Ninja research. A save from before this update gets the projects it already uses, once.</p></div>

<div class="msec" style="max-height:330px;overflow:auto"><p style="margin:0 0 8px">Steady pressure breaks a fighter. Hits, taijutsu, stuns, knockbacks and fear fill a small meter under their name; attacking together, from the side or from behind fills it faster, and it drains when the pressure stops.</p><p style="margin:0 0 8px">A broken fighter is stunned for a few seconds and can't dodge, then can't be broken again for a while. The ninja who caused the break runs their combo: strikes, taijutsu and quick jutsu in the order you chose, ending in a finisher.</p><p style="margin:0 0 8px">Combos start with 2 steps and grow to 5 as a ninja levels up. Enemy ninja build combos too.</p></div>
<div class="msec" style="border-left:3px solid var(--w-good)"><h4 class="mgood">Try it</h4><p style="margin:0">Select a ninja, open Ninja orders and pick Combo to build their combo.</p></div>

<div class="msec" style="max-height:330px;overflow:auto"><p style="margin:0 0 8px">Drafted ninja take a stance: Vanguard closes in for melee, Support heals and buffs from behind, Assassin hides and hunts marked targets and casters, Sealer binds and stuns, Barrage keeps its distance and casts ranged ninjutsu. Stances only steer idle drafted pawns; your own orders always win.</p><p style="margin:0 0 8px">Right-click an enemy to mark it as the squad's priority. Two or more drafted pawns can hold a formation. Guard posts and patrol routes (Security tab) keep watch. Badly hurt pawns fall back to a bed or cover; each has a Fall back button.</p></div>

<div class="msec" style="max-height:330px;overflow:auto"><ul style="margin:0 0 8px;padding-left:18px"><li>The Ninja world button on the bottom bar opens your village, the war, faction standing, the chūnin exam, duties and missions, and a list of your ninja with their rank. Its Getting started section suggests what to do next.</li><li>A few tip letters arrive over the first days; they can be turned off from the letter.</li><li>Options → Mod settings → NFRP World has side tabs: Looks, Combat, World, Village life, Performance and Dev. The search box at the top finds any setting by name, each tab shows how many settings you changed, and Reset this tab puts them back. Hover over any setting for a short explanation.</li><li>The look presets at the top (Cinematic, Balanced, Performance, Vanilla-like) change only looks and performance, never gameplay. If the game slows down in big fights, try Performance.</li></ul></div>
