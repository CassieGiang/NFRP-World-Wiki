<div class="mtitle">Ninja build: Aiko</div>
<div class="msec"><h4 style="color:var(--w-on);font-size:14px;text-transform:none;letter-spacing:0">How builds work (from NFRP's Specialists)</h4>
<ul style="margin:0;padding-left:20px"><li style="margin:0 0 6px">Pick either 2 Specialists + 2 Non-Specialists, or 1 Master + 1 Non-Specialist. Each pick must be a different kind: Ninjutsu, Genjutsu, Taijutsu, Clan or Medical.</li><li style="margin:0 0 6px">Each kind covers trees: Ninjutsu the element arts and the archive ninjutsu (sealing, transformation, skill and beast arts and so on), Genjutsu the genjutsu trees and the six illusion schools, Taijutsu the fighting and weapon styles (old and archive), Medical the medical arts, Medical Skill, Sensor and Soulcaster.</li><li style="margin:0 0 6px">Entering a tree (learning its first technique) uses a slot. A Master can enter 8 trees of its kind, a Specialist 6, a Non-Specialist 4.</li><li style="margin:0 0 6px">Mastered trees go up to S rank. Every other tree stops at B rank. A Master can master 6 trees, a Specialist 4, a Non-Specialist 2. A tree is mastered automatically when you learn its first A-rank technique while a mastery is free.</li><li style="margin:0 0 6px">A Master also gets 2 extra slots for trees of other kinds (up to B rank).</li><li style="margin:0 0 6px">Kinds you didn't pick are closed. Medical is the exception: anyone can learn medical arts up to D rank, but higher needs a Medical Specialist (Specialist only, and not together with Ninjutsu Specialist).</li><li style="margin:0 0 6px">Your own clan's techniques are always free and go up to S rank. Clan picks give more chakra and faster recovery.</li><li style="margin:0 0 6px">Universal ninjutsu (including the Academy arts and the Bard, Venator, ANBU and Monster Trainer professions) goes up to C rank for everyone; a Ninjutsu or Clan pick raises it (Non-Specialist B, Specialist A, Master S; Medical Specialist A).</li><li style="margin:0 0 6px">Universal taijutsu works the same way, raised by a Taijutsu or Clan pick.</li><li style="margin:0 0 6px">Later you can trade a mastery for Grand Master (master a tree you normally couldn't, up to 3 times) or Jack of Trades (universal ninjutsu one rank higher, once).</li><li style="margin:0 0 6px">Respec: the first is free. After that it needs a Revamp Scroll and costs part of your levels (25% at D class up to 45% at S) in every kind you drop or step down. Techniques the new build doesn't allow are forgotten; clan techniques never are.</li><li style="margin:0 0 6px">Each pick also gives a small stat bonus. Techniques you already knew before choosing are kept.</li></ul></div>

<div class="msec"><h4 style="color:var(--w-on);font-size:14px;text-transform:none;letter-spacing:0">How builds work (from NFRP's Specialists)</h4>
<ul style="margin:0;padding-left:20px"><li style="margin:0 0 6px">Pick either 2 Specialists + 2 Non-Specialists, or 1 Master + 1 Non-Specialist. Each pick must be a different kind: Ninjutsu, Genjutsu, Taijutsu, Clan or Medical.</li><li style="margin:0 0 6px">Each kind covers trees: Ninjutsu the element arts and the archive ninjutsu (sealing, transformation, skill and beast arts and so on), Genjutsu the genjutsu trees and the six illusion schools, Taijutsu the fighting and weapon styles (old and archive), Medical the medical arts, Medical Skill, Sensor and Soulcaster.</li><li style="margin:0 0 6px">Entering a tree (learning its first technique) uses a slot. A Master can enter 8 trees of its kind, a Specialist 6, a Non-Specialist 4.</li><li style="margin:0 0 6px">Mastered trees go up to S rank. Every other tree stops at B rank. A Master can master 6 trees, a Specialist 4, a Non-Specialist 2. A tree is mastered automatically when you learn its first A-rank technique while a mastery is free.</li><li style="margin:0 0 6px">A Master also gets 2 extra slots for trees of other kinds (up to B rank).</li><li style="margin:0 0 6px">Kinds you didn't pick are closed. Medical is the exception: anyone can learn medical arts up to D rank, but higher needs a Medical Specialist (Specialist only, and not together with Ninjutsu Specialist).</li><li style="margin:0 0 6px">Your own clan's techniques are always free and go up to S rank. Clan picks give more chakra and faster recovery.</li><li style="margin:0 0 6px">Universal ninjutsu (including the Academy arts and the Bard, Venator, ANBU and Monster Trainer professions) goes up to C rank for everyone; a Ninjutsu or Clan pick raises it (Non-Specialist B, Specialist A, Master S; Medical Specialist A).</li><li style="margin:0 0 6px">Universal taijutsu works the same way, raised by a Taijutsu or Clan pick.</li><li style="margin:0 0 6px">Later you can trade a mastery for Grand Master (master a tree you normally couldn't, up to 3 times) or Jack of Trades (universal ninjutsu one rank higher, once).</li><li style="margin:0 0 6px">Respec: the first is free. After that it needs a Revamp Scroll and costs part of your levels (25% at D class up to 45% at S) in every kind you drop or step down. Techniques the new build doesn't allow are forgotten; clan techniques never are.</li><li style="margin:0 0 6px">Each pick also gives a small stat bonus. Techniques you already knew before choosing are kept.</li></ul></div>
