<div class="mtitle">Scroll of Binding seals<small>tree scroll (common)</small></div>
<div class="msec">
  <p style="margin:0">Common tree scroll. Reading it opens Kōsoku Fūin (Binding seals) and teaches Chi to Sumi no Kongō (Blood Ink Mixture) for free.</p>
  <p class="mmuted" style="margin:6px 0 0">Market value: $400</p>
</div>
<p class="mmuted" style="font-size:12px">Select a ninja, right-click the scroll:</p>
<div class="mrowbtns"><button class="mbtn pri" data-go="study">Study scroll of Binding seals</button></div>
</div>

<div class="mpage" data-page="study" hidden>
<div class="mtitle">Studying</div>
<p>Aiko takes the scroll and studies it (about 2,500 ticks, under a minute of game time at normal speed).</p>
<div class="mrowbtns"><button class="mbtn pri" data-go="done">Finish</button><button class="mbtn" data-back>Back</button></div>
</div>
<div class="mpage" data-page="done" hidden>
<div class="mtitle">Message</div>
<p class="mgood">Aiko studied the scroll and opened Kōsoku Fūin (Binding seals), learning Chi to Sumi no Kongō (Blood Ink Mixture).</p>
<p class="mmuted">The scroll is used up. The rest of the tree is now bought with Training Points in the Learn techniques window, up to what the build allows.</p>
<div class="mrowbtns"><button class="mbtn" data-tab="inspect">Start over</button></div>
</div>

<div class="mpage" data-page="refused" hidden>
<div class="mtabs" role="tablist"><button data-tab="inspect" data-also="study done">A scroll on the map</button><button data-tab="refused" data-also="">Can't read it yet</button><button data-tab="write" data-also="written">Writing one (scribe desk)</button></div>
<div class="mtitle">Scroll of Heavenly Release<small>tree scroll (powerful)</small></div>
<p class="mmuted" style="font-size:12px">Right-click with a D-class ninja:</p>
<div class="mrowbtns"><button class="mbtn off" title="">Study scroll of Heavenly Release</button></div>
<p class="mwarn">A powerful scroll: Aiko needs B class (1500 TP) to understand it, and is D class.</p>
<p class="mmuted">Other reasons you may see: the ninja already knows the tree; the build has no free slot of that kind (the scroll is not used up); a beast art or the Eight Gates still needs its clan gene or Taijutsu Specialist.</p>

  <div class="mrow mmuted">Katon (Fire Release Arts): Katon: Gōkakyū no Jutsu (Fire Release: Great Fireball) (C)</div>
</div>
</div>

<p>Writing: tree scroll of Binding seals. Add the <b>write tree scroll (common)</b> bill at a scribe desk; the ninja writes it there. Rare and powerful scrolls have their own bills with the A- and S-rank writing materials.</p>
