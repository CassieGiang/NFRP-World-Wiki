<div class="msec"><p style="margin:0 0 8px">The chūnin exam in Kaedegakure:</p><p style="margin:0 0 8px">Aiko (level 9):<br>  - passed the written test.<br>  - got through the survival trial, outlasting Sora Ibuki, a genin of Haigakure.<br>  - won the final duel against Tsubaki Hamon, a genin of Nagisagakure, and was named chūnin!<br>  - gained 600 ninjutsu XP.</p><p style="margin:0 0 8px">Kenta (level 8):<br>  - passed the written test.<br>  - got through the survival trial, outlasting Daichi Sen, a genin of Tetsugakure.<br>  - lost the final duel to Tsubaki Hamon, a genin of Nagisagakure.<br>  - gained 300 taijutsu XP.<br>  - came back bruised.</p><p style="margin:0 0 8px">Mei (level 7):<br>  - failed the written test.<br>  - gained 60 genjutsu XP.</p><p style="margin:0">Kaedegakure was impressed: goodwill +11.</p></div>
<p class="mmuted">The results come as a letter. Without promotions it is titled "Chūnin exam results". Rival genin are named when the living world is on; otherwise they are "a genin of" another village. When your own hidden village hosts the exam, the villages that came to watch gain goodwill instead.</p>
