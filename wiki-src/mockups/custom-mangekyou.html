<div class="mtitle">Mangekyō: Sayo<small>letter</small></div>
<p>Sayo's Sharingan has changed into a Mangekyō Sharingan.</p>
<p>Keep the eye that awakened, with its own techniques, or shape your own: choose one power for each eye, a power for both, a pattern and a colour. A shaped eye can't be changed afterwards. Until you choose, Sayo keeps the eye that awakened.</p>
