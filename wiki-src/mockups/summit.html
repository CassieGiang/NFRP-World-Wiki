<div class="mpage" data-page="letter">
  <div class="mtitle">The leaders' summit <small>letter</small></div>
  <p>The leaders of the hidden villages meet on neutral ground in the mountains: the kaidan, the leaders' summit. As a village leader, Hoshi has a seat at the table.</p>
  <p>At the summit you can propose alliances and ceasefires, and call for a united front against the Black Ink Syndicate. Proposals can be refused; a refusal costs a little goodwill. Allying with a village annoys its enemies.</p>
  <p>The invitation stands for three days.</p>
  <div class="mrowbtns"><button class="mbtn pri" data-go="s0">Go to the summit</button><button class="mbtn" data-go="regrets">Send regrets</button><button class="mbtn" data-go="postpone">Postpone</button></div>
</div>

<div class="mpage" data-page="regrets" hidden>
  <button class="mbtn sm mback" data-back>&#8592; Back</button>
  <p>The letter goes away and the leaders meet without you. The next summit comes in about 60 days.</p>
</div>

<div class="mpage" data-page="postpone" hidden>
  <button class="mbtn sm mback" data-back>&#8592; Back</button>
  <p>The letter stays in the letter stack until the three days run out.</p>
</div>
